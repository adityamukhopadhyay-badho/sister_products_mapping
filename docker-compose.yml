services:
  api:
    build: .
    container_name: sister-products-api
    ports:
      - "8000:8000"
    environment:
      # Database credentials (hardcoded since not pushed to GitHub)
      - DB_HOST=db.badho.in
      - DB_PORT=5432
      - DB_NAME=badho-app
      - DB_USER=postgres
      - DB_PASSWORD=Badho_1301
      # Application settings
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional Redis service (commented out by default)
